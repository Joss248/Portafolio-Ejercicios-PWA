
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Sin Conexión</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            color: #243247;
        }

        .offline-container {
            max-width: 440px;
            margin: 20px;
            padding: 40px 30px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .offline-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1976d2;
            font-size: 28px;
        }

        p {
            line-height: 1.6;
            color: #5f6b7a;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1259a3;
        }
    </style>
</head>

<body>
    <main class="offline-container">
        <div class="offline-icon">📡</div>

        <h1>Modo Sin Conexión</h1>

        <p>
            No fue posible cargar el contenido solicitado
            porque no tienes conexión a Internet y
            este recurso no está disponible en caché.
        </p>

        <p>
            Verifica tu conexión e inténtalo nuevamente.
        </p>

        <button onclick="window.location.reload()">
            Reintentar conexión
        </button>
    </main>
</body>
</html>
