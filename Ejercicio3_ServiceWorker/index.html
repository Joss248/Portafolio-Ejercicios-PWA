<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi PWA - App Shell</title>
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1976d2">

    <link rel="icon" href="icons/TaskGo_192x192px.png">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header">
        <div class="header-container">
            <h1>Mi Aplicación</h1>

            <button class="menu-button" id="menuButton">
                ☰
            </button>
        </div>

        <nav class="navigation" id="navigation">
            <a href="#inicio">Inicio</a>
            <a href="#servicios">Servicios</a>
            <a href="#acerca">Acerca de</a>
        </nav>
    </header>

    <main class="main-content">

       <main class="main-content">

    <section>
        <h2>Gestión de tareas</h2>

        <p class="description">
            Registra tareas para almacenarlas localmente en el dispositivo.
        </p>

        <div class="task-form">
            <input
                type="text"
                id="taskInput"
                placeholder="Escribe una nueva tarea"
            >

            <button id="saveTaskButton">
                Guardar tarea
            </button>
        </div>
    </section>

    <section>
        <h2>Tareas almacenadas</h2>

        <div id="taskList">
            <p>No hay tareas almacenadas.</p>
        </div>
    </section>

</main>

    </main>

    <script src="js/database.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
